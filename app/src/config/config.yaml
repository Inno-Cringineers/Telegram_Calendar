# Telegram Calendar Bot Configuration

# Environment variables:
# TELEGRAM_TOKEN - Telegram API token
# POSTGRES_HOST - PostgreSQL host
# POSTGRES_USER - PostgreSQL user
# POSTGRES_PASSWORD - PostgreSQL password
# POSTGRES_DB - PostgreSQL database
# POSTGRES_PORT - PostgreSQL port
# SINGLE_USER - Single user mode (True) or multi-user mode (False)

# Database settings
database:
  url: postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@${POSTGRES_HOST}:${POSTGRES_PORT}/${POSTGRES_DB}

# Logger settings
logger:
  # Console output level
  level: ${LOG_LEVEL:-DEBUG}
  # Format: 'simple' or 'detailed'
  format: detailed
  # Show in console
  console: true
  # File logging
  file:
    enabled: true
    path: logs/bot.log
    max_bytes: 10485760 # 10MB
    backup_count: 5

# Bot settings
bot:
  # Timeout for polling
  timeout: 30
  # Single user mode
  single_user: ${SINGLE_USER:-false}
  # Telegram token
  telegram_token: ${TELEGRAM_TOKEN}
  # Sync workers
  sync_workers: ${SYNC_WORKERS:-2}
  # Sync interval in seconds
  sync_interval: ${SYNC_INTERVAL:-60}
  # Metrics update interval in seconds (default: 5 minutes = 300 seconds)
  metrics_interval: ${METRICS_INTERVAL:-300}
  # User restriction enabled (restrict bot access to whitelisted users only)
  user_restriction_enabled: ${USER_RESTRICTION_ENABLED:-false}
  # Path to whitelist JSON file
  whitelist_path: ${WHITELIST_PATH:-whitelist.json}

# Default user settings
settings:
  # Default timezone
  timezone: UTC+3
  # Default language
  language: en
  # Quiet hours enabled by default
  quiet_hours_enabled: false
  # Quiet hours start time (HH:MM)
  quiet_hours_start: "00:00"
  # Quiet hours end time (HH:MM)
  quiet_hours_end: "06:00"
  # Daily plans enabled by default
  daily_plans_enabled: true
  # Daily plans time (HH:MM)
  daily_plans_time: "09:00"
  # Default reminder enabled by default
  default_reminder_enabled: true
  # Default reminder offset in seconds (15 minutes = 900 seconds)
  default_reminder_offset: 900
