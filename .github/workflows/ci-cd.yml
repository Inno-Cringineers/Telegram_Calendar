name: CI/CD Pipeline

on:
  push:
    paths: ["app/**", ".github/workflows/**"]
  workflow_dispatch:
    inputs:
      debug_enabled:
        type: boolean
        description: "Enable tmate debugging"
        default: false

jobs:
  lint:
    uses: ./.github/workflows/lint.yml

  test:
    uses: ./.github/workflows/test.yml

  docker-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - working-directory: app
        run: docker build -t telegram-calendar-bot:test .
      - run: |
          docker run --rm \
            -e TELEGRAM_TOKEN=dummy_token_for_ci \
            -e DB_URL=sqlite:////app/data/storage.db \
            telegram-calendar-bot:test python -c "import sys; sys.exit(0)"

  debug:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.debug_enabled }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: mxschmitt/action-tmate@v3
        with:
          detached: true